name: KFPR weather

# aviationweather.gov blocks direct browser calls (no CORS), so this job fetches
# the KFPR METAR, TAF and airport data on GitHub's side and publishes them on the
# `metar-data` branch, which the page reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metar.yml"]

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch METAR and airport data
        run: |
          set -euo pipefail
          mkdir out
          UA="P2010-flight-prep (github.com/Matthieumdb/P2010)"
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/metar?ids=KFPR&format=json&hours=3" -o out/KFPR-metar.json
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/airport?ids=KFPR&format=json" -o out/KFPR-airport.json
          curl -fsS -A "$UA" "https://aviationweather.gov/api/data/taf?ids=KFPR&format=json" -o out/KFPR-taf.json
          date -u +%Y-%m-%dT%H:%M:%SZ > out/updated.txt
          head -c 300 out/KFPR-metar.json; echo
      - name: Publish to the metar-data branch
        run: |
          set -euo pipefail
          cd out
          git init -q -b metar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "KFPR weather $(cat updated.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" metar-data
