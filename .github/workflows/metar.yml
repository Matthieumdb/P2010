name: KFPR weather

# aviationweather.gov blocks direct browser calls (no CORS), so this job fetches
# the KFPR METAR, TAF and airport data on GitHub's side and publishes them on the
# `metar-data` branch, which the page reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metar.yml"]

permissions:
  contents: write

concurrency:
  group: metar
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch METAR and airport data
        run: |
          set -euo pipefail
          mkdir out
          UA="P2010-flight-prep (github.com/Matthieumdb/P2010)"
          PREV="https://raw.githubusercontent.com/${{ github.repository }}/metar-data"
          # One failing endpoint must not block the others: retry, then keep the previously published file.
          get() {
            curl -fsS -A "$UA" --retry 4 --retry-all-errors --retry-delay 5 -m 30 "$1" -o "out/$2" && [ -s "out/$2" ] && return 0
            echo "::warning::$2 not refreshed, keeping the previous copy"
            curl -fsS "$PREV/$2" -o "out/$2" || true
          }
          get "https://aviationweather.gov/api/data/metar?ids=KFPR&format=json&hours=3" KFPR-metar.json
          get "https://aviationweather.gov/api/data/airport?ids=KFPR&format=json" KFPR-airport.json
          get "https://aviationweather.gov/api/data/taf?ids=KFPR&format=json" KFPR-taf.json
          # Briefing tab: FB winds aloft (6 h forecast, all CONUS stations) and PIREPs within 100 nm.
          # Region names differ between API versions: try the Miami region, then all regions.
          for R in mia all; do
            curl -fsS -A "$UA" --retry 2 --retry-delay 5 -m 30 "https://aviationweather.gov/api/data/windtemp?region=$R&level=low&fcst=06" -o out/FB.txt && grep -q "^ *FT  *3000" out/FB.txt && break
            echo "::warning::winds aloft region=$R refused"; rm -f out/FB.txt
          done
          [ -s out/FB.txt ] || curl -fsS "$PREV/FB.txt" -o out/FB.txt || true
          # An empty PIREP list is a valid answer, so no fallback to the previous copy here.
          curl -fsS -A "$UA" --retry 4 --retry-all-errors --retry-delay 5 -m 30 "https://aviationweather.gov/api/data/pirep?id=KFPR&distance=100&age=3&format=raw" -o out/KFPR-pirep.txt || curl -fsS "$PREV/KFPR-pirep.txt" -o out/KFPR-pirep.txt || true
          date -u +%Y-%m-%dT%H:%M:%SZ > out/updated.txt
          head -c 300 out/KFPR-metar.json; echo
      - name: Publish to the metar-data branch
        run: |
          set -euo pipefail
          cd out
          git init -q -b metar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "KFPR weather $(cat updated.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" metar-data
